# Copy to `vanta.toml` (git-ignored) and point it at YOUR files.
# Every path must be OUTSIDE the repository; the tools refuse otherwise.
# Environment variables (shown below) take precedence over this file.
# VANTA_CONFIG selects a different config file.

[paths]
# Your own dump of the title.     env: VANTA_GAME_DIR
game_dir = 'D:\vanta-data\game'

# Derived data. Default: %LOCALAPPDATA%\vanta\cache.   env: VANTA_CACHE_DIR
# cache_dir = 'D:\vanta-data\cache'

# What titles save (persistent local storage), kept apart from the cache.
# Default: %LOCALAPPDATA%\vanta\data.   env: VANTA_DATA_DIR
# data_dir = 'D:\vanta-data\data'

# Other Xbox Series titles used to test platform-level code.
# env: VANTA_TEST_TITLES (separated by ';')
test_titles = []
